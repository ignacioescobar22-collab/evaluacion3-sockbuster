<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Sockbuster - Catálogo</title><style>body{font-family:Arial,sans-serif;margin:20px;background-color:#f4f4f4;}header{display:flex;justify-content:space-between;background:#111;color:white;padding:15px;}.filter-section{margin:20px 0;}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}.card{background:white;padding:15px;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);text-align:center;}.card img{max-width:100%;height:150px;object-fit:cover;}.btn-add{background:#28a745;color:white;border:none;padding:8px;cursor:pointer;width:100%;border-radius:4px;}.cart-box{background:white;padding:15px;margin-top:20px;border-radius:8px;}</style></head><body><header><h2>🎬 Sockbuster Catálogo</h2><a href="index.html" style="color:white;">Volver al Inicio</a></header><div class="filter-section"><label><strong>Filtrar por Colección Temática:</strong> </label><select id="categoryFilter" onchange="filterProducts()"><option value="todos">Todos los Modelos</option><option value="Ciencia Ficción">Ciencia Ficción</option><option value="Terror 80s">Terror 80s</option><option value="Animación">Animación</option></select></div><div class="grid" id="productGrid"></div><div class="cart-box"><h3>🛒 Carrito de Compras</h3><ul id="cartItems"></ul><p><strong>Total:</strong> $<span id="cartTotal">0</span></p><button onclick="simulateCheckout()" style="background:#007bff; color:white; padding:10px; border:none; cursor:pointer;">Proceder al Checkout</button></div><script>const productos=[{id:1,nombre:"Calcetines Marty McFly",cat:"Ciencia Ficción",precio:5990,stock:12,img:"https://unsplash.com"},{id:2,nombre:"Calcetines Freddy Krueger",cat:"Terror 80s",precio:6490,stock:5,img:"https://unsplash.com"},{id:3,nombre:"Calcetines Homer Simpson",cat:"Animación",precio:4990,stock:20,img:"https://unsplash.com"}];let carrito=;function renderProducts(lista){const grid=document.getElementById("productGrid");grid.innerHTML="";lista.forEach(p=>{grid.innerHTML+=`<div class="card"><img src="${p.img}" alt="${p.nombre}"><h4>${p.nombre}</h4><p>Colección: ${p.cat}</p><p><strong>Precio:</strong> $${p.precio}</p><p>Stock: ${p.stock} | Tallas: M, L</p><button class="btn-add" onclick="addToCart(${p.id})">Agregar al Carrito</button></div>`;});}function filterProducts(){const val=document.getElementById("categoryFilter").value;const filtrados=val==="todos"?productos:productos.filter(p=>p.cat===val);renderProducts(filtrados);}function addToCart(id){const prod=productos.find(p=>p.id===id);carrito.push(prod);updateCart();}function updateCart(){const list=document.getElementById("cartItems");list.innerHTML="";let total=0;carrito.forEach((item,index)=>{list.innerHTML+=`<li>${item.nombre} - $${item.precio} <button onclick="removeItem(${index})">❌</button></li>`;total+=item.precio;});document.getElementById("cartTotal").innerText=total;}function removeItem(index){carrito.splice(index,1);updateCart();}function simulateCheckout(){if(carrito.length===0)return alert("El carrito está vacío");const orderId="SB-"+Math.floor(Math.random()*900000+100000);alert(`🎉 ¡Simulación de Compra Exitosa!\n\nID Único de Pedido: ${orderId}\nTotal procesado de forma segura vía HTTPS.`);carrito=;updateCart();}renderProducts(productos);</script></body></html>
